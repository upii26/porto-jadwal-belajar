basePath: /api
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Swagger Example API
  version: "1.0"
paths:
  /dosen:
    get:
      consumes:
      - application/json
      description: mengambil data dosen
      produces:
      - application/json
      responses: {}
      summary: menampilkan semua data dosen
      tags:
      - dosen
  /dosen/{NDS}:
    get:
      consumes:
      - application/json
      description: mengambil data berdasarkan NoDosen
      parameters:
      - description: NoDosen
        in: path
        name: nim
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: menampilkan data dosen
      tags:
      - dosen
  /mahasiswa:
    get:
      consumes:
      - application/json
      description: mengambil data mahasiswa
      produces:
      - application/json
      responses: {}
      summary: menampilkan semua data mahasiswa
      tags:
      - mahasiswa
  /mahasiswa/{nim}:
    get:
      consumes:
      - application/json
      description: mengambil data berdasarkan NIM
      parameters:
      - description: NIM
        in: path
        name: nim
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: menampilkan data mahasiswa
      tags:
      - mahasiswa
swagger: "2.0"
